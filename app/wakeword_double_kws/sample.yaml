sample:
  description: Continuous DMIC audio pipeline that waits for the "Okay Nordic" wakeword, then runs nRF Edge AI keyword spotting in a 7-second active window and returns to recognized multiple keywords in sequence (phrase).
  name: Wakeword gated Double KeyWord Spotting / Phrase application

common:
  sysbuild: true
  build_only: true
  tags:
    - axon
    - axon_audio_models
    - axon_wakeword_double_kws

tests:
  applications.wakeword_double_kws.zdebug:
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
